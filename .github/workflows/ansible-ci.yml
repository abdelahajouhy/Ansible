---
name: Ansible CI
on: [push]
jobs:
  ansible-ci:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Python
        run: |
            python3 --version

      - name: Install YAML lint
        run: |
            python3 -m pip install yamllint
            yamllint ${{ github.workspace }}/projets/
