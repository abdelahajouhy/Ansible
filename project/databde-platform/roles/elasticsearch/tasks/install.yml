---
- name: Linux group creation 
  ansible.builtin.group:
    name: "{{ elasticsearch_user_group }}"

- name: Linux user creation
  ansible.builtin.user:
    name: "{{ elasticsearch_user_owner }}"
    group: "{{ elasticsearch_user_group }}"
    shell: /sbin/nologin
    create_home: false
    system: true

- name: Directories creation
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ elasticsearch_user_owner }}"
    group: "{{ elasticsearch_user_group }}"
    mode: "0750"
  loop:
    - "{{ elasticsearch_app_dir }}"
    - "{{ elasticsearch_log_dir }}"
    - "{{ elasticsearch_path_data }}"
    - "{{ elasticsearch_path_certs }}"

- name: Download and extract archive
  ansible.builtin.unarchive:
    src: "{{ elasticsearch_download_url }}"
    dest: "{{ elasticsearch_app_dir }}"
    remote_src: true
    owner: "{{ elasticsearch_user_owner }}"
    group: "{{ elasticsearch_user_group }}"
    extra_opts: ["--strip-components=1"]
    creates: "{{ elasticsearch_app_dir }}/bin/elasticsearch"

- name: Elasticsearch memory map limit
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "262144"
    sysctl_file: /etc/sysctl.d/99-elasticsearch.conf
    reload: true
