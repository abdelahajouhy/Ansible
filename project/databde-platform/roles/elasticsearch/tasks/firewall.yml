---
- name: Firewalld install
  ansible.builtin.apt:
    name: firewalld
    state: present
    update_cache: true

- name: Enable and start firewalld service
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Firewalld rule for HTTP Elasticsearch ports
  ansible.posix.firewalld:
    port: "{{ elasticsearch_http_port }}/tcp"
    permanent: true
    state: enabled
    immediate: true

- name: Firewalld rule for transport Elasticsearch ports
  ansible.posix.firewalld:
    port: 9300/tcp
    permanent: true
    state: enabled
    immediate: true