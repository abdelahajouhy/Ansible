---
- name: Créer le groupe
  ansible.builtin.group:
    name: "{{ elasticsearch_user_group }}"

- name: Créer l'utilisateur
  ansible.builtin.user:
    name: "{{ elasticsearch_user_owner }}"
    group: "{{ elasticsearch_user_group }}"
    shell: /sbin/nologin
    system: true

- name: Créer les répertoires
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ elasticsearch_user_owner }}"
    group: "{{ elasticsearch_user_group }}"
    mode: "0750"
  loop:
    - "{{ elasticsearch_app_dir }}"
    - "{{ elasticsearch_log_dir }}"
    - "{{ elasticsearch_path_data }}"

- name: Extraire Elasticsearch
  ansible.builtin.unarchive:
    src: "{{ download_url }}"
    dest: "{{ elasticsearch_app_dir }}"
    remote_src: true
    owner: "{{ elasticsearch_user_owner }}"
    group: "{{ elasticsearch_user_group }}"
    extra_opts: ["--strip-components=1"]
    creates: "{{ elasticsearch_app_dir }}/bin/elasticsearch"

- name: vm.max_map_count
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "262144"
    sysctl_file: /etc/sysctl.d/99-elasticsearch.conf
    reload: true