---
- name: elasticsearch.yml
  ansible.builtin.template:
    src: elasticsearch.yml.j2
    dest: "{{ elasticsearch_app_dir }}/config/elasticsearch.yml"
    owner: "{{ elasticsearch_user_owner }}"
    group: "{{ elasticsearch_user_group }}"
    mode: "0640"
  notify: Restart Elasticsearch

- name: JVM options
  ansible.builtin.template:
    src: jvm.options.j2
    dest: "{{ elasticsearch_app_dir }}/config/jvm.options"
    owner: "{{ elasticsearch_user_owner }}"
    group: "{{ elasticsearch_user_group }}"
    mode: "0640"
  notify: Restart Elasticsearch
