---
- name: elasticsearch.yml
  ansible.builtin.template:
    src: elasticsearch.yml.j2
    dest: "{{ app_dir }}/config/elasticsearch.yml"
    owner: "{{ user_owner }}"
    group: "{{ user_group }}"
    mode: "0640"

- name: JVM options
  ansible.builtin.template:
    src: jvm.options.j2
    dest: "{{ app_dir }}/config/jvm.options"
    owner: "{{ user_owner }}"
    group: "{{ user_group }}"
    mode: "0640"
  notify: Restart Elasticsearch
