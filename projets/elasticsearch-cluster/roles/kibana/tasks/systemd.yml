---
- name: Déployer l'unit systemd Kibana
  ansible.builtin.template:
    src: kibana.service.j2
    dest: /etc/systemd/system/kibana.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart kibana

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Activer et démarrer Kibana
  ansible.builtin.systemd:
    name: kibana
    enabled: true
    state: started

- name: Attendre que Kibana écoute
  ansible.builtin.wait_for:
    port: "{{ kibana_server_port }}"
    host: "{{ ansible_default_ipv4.address }}"
    delay: 5
    timeout: 180

- name: Vérifier que Kibana répond
  ansible.builtin.uri:
    url: "https://{{ ansible_default_ipv4.address }}:{{ kibana_server_port }}/api/status"
    method: GET
    status_code: [200, 401]
  register: kibana_ready
  until: kibana_ready.status in [200, 401]
  retries: 30
  delay: 5