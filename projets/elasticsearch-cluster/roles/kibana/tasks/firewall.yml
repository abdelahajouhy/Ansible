---
- name: Firewalld install
  ansible.builtin.apt:
    name: firewalld
    state: present
    update_cache: true

- name: Enable and start firewalld service
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Firewalld rule for HTTP Kibana ports
  ansible.posix.firewalld:
    port: "{{ kibana_server_port }}/tcp"
    permanent: true
    state: enabled
