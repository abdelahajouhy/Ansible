---
- name: Installer firewalld
  ansible.builtin.apt:
    name: firewalld
    state: present
    update_cache: true

- name: Démarrer et activer firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Autoriser Kibana
  ansible.posix.firewalld:
    port: "{{ kibana_server_port }}/tcp"
    permanent: true
    state: enabled
