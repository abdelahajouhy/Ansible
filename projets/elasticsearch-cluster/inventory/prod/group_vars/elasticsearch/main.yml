---
elasticsearch_user_owner: elasticsearch
elasticsearch_user_group: elasticsearch

elasticsearch_app_dir: "{{ global_dir_app }}/elasticsearch"
elasticsearch_log_dir: "{{ global_dir_log }}/elasticsearch"

elasticsearch_version: "9.5.4"
elasticsearch_download_url: "https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-{{ elasticsearch_version }}-linux-x86_64.tar.gz"

# --- config ---
elasticsearch_cluster_name: "cluster-databde-{{ env }}"
elasticsearch_path_data: "{{ elasticsearch_app_dir }}/data"
elasticsearch_path_certs: "{{ elasticsearch_app_dir }}/config/certs"
elasticsearch_path_logs: "{{ elasticsearch_log_dir }}"

elasticsearch_http_port: 9200
# --- Discovery ---
elasticsearch_single_node: false
elasticsearch_cluster_bootstrap: false  # true on the initial deployment, false once the cluster has formed

# Used only when elasticsearch_single_node: false
elasticsearch_discovery_seed_hosts: "{{ groups['elasticsearch'] | map('extract', hostvars, 'ansible_host') | list }}"
elasticsearch_cluster_initial_master_nodes:
  - srv-abde01
  - srv-abde02
  - srv-abde03

# --- Cluster ---
elasticsearch_allocation_awareness_attributes: "rack_id"

# --- Memory ---
elasticsearch_heap: "512m"
elasticsearch_memory_lock: false

# --- Security ---
elasticsearch_security_enabled: true
elasticsearch_security_bootstrap: true         
elasticsearch_transport_ssl_enable: true                      # Set to true when transport.p12 exists
elasticsearch_http_ssl_enable: true                           # Set to true when http.p12 exists
elasticsearch_transport_ssl_verification_mode: "certificate"
elasticsearch_monitoring_user: "otel_monitor"